<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space, Translated</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <div class="oculus is-loading" id="oculus">
      <img class="oculus-image" id="oculus-image" alt="">
      <video class="oculus-video" id="oculus-video" muted loop playsinline autoplay></video>
      <iframe class="oculus-video-frame" id="oculus-video-frame" allow="autoplay; encrypted-media" frameborder="0"></iframe>
      <div class="oculus-fallback" id="oculus-fallback"><span>&#9737;</span></div>
    </div>

    <div class="epic-screen" id="epic-screen">
      <img class="epic-image" id="epic-image" alt="">
    </div>

    <div class="stat-screen key-screen" id="key-screen">
      <canvas class="key-bg" id="cme-bg" aria-hidden="true"></canvas>
      <canvas class="key-bg" id="asteroid-bg" aria-hidden="true"></canvas>
      <canvas class="key-bg" id="flare-bg" aria-hidden="true"></canvas>
      <canvas class="key-bg" id="streak-bg" aria-hidden="true"></canvas>
      <canvas class="key-bg" id="wind-bg" aria-hidden="true"></canvas>
      <canvas class="key-bg" id="aurora-bg" aria-hidden="true"></canvas>
      <div class="fc">
        <h1 class="visually-hidden">Cosmic Meteorology</h1>
        <div class="fc-days" id="key-cards" aria-live="polite"></div>
      </div>
    </div>

    <canvas id="art"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-dot" id="status-dot"></span>
      <span class="visually-hidden" id="status-text">Connecting to live data&hellip;</span>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
